<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZLJ Wardrobe Collection — P01 Outfit Review</title>
<style>
:root{
  --bg:#0d0f14; --bg2:#141821; --card:#181d28; --card2:#1e2432;
  --line:#2a3143; --line2:#39435c;
  --tx:#e8ecf5; --tx2:#98a3bb; --tx3:#6b768f;
  --keep:#2fbf71; --keepbg:#12301f; --partial:#e0a72e; --partialbg:#332613;
  --drop:#e05c5c; --dropbg:#331616; --undec:#4a5570; --undecbg:#1c2130;
  --acc:#6ea8fe; --radius:14px; --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:200px}
body{
  background:var(--bg); color:var(--tx);
  font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--acc)}
.wrap{max-width:2100px;margin:0 auto;padding:0 22px}

/* ---------------- header ---------------- */
header{
  position:sticky;top:0;z-index:60;background:rgba(13,15,20,.96);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:14px 0 12px;
}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:19px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:12px;color:var(--tx3);letter-spacing:1.4px;text-transform:uppercase}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;
}
.pill b{font-variant-numeric:tabular-nums;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.t{background:var(--tx3)} .dot.k{background:var(--keep)} .dot.p{background:var(--partial)}
.dot.d{background:var(--drop)} .dot.u{background:var(--undec)}
.bar{height:9px;background:var(--card);border-radius:999px;overflow:hidden;flex:1;min-width:220px;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--keep),#57d68a);transition:width .25s}

/* ---------------- toolbar ---------------- */
.toolbar{position:sticky;top:118px;z-index:50;background:rgba(20,24,33,.95);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0}
.trow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trow+.trow{margin-top:8px}
.lab{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.9px;margin-right:2px}
input[type=search],select,textarea,input[type=text]{
  background:var(--card);border:1px solid var(--line);color:var(--tx);
  border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;outline:none;
}
input[type=search]{min-width:230px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
select{cursor:pointer}
button{
  background:var(--card2);border:1px solid var(--line2);color:var(--tx);
  border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;
  font-weight:600;transition:.12s;
}
button:hover{background:#283044;border-color:#4a5570}
button:active{transform:translateY(1px)}
button.on{background:#24304a;border-color:var(--acc);color:#cfe0ff}
.btn-next{background:#1c3a2a;border-color:#2f6b47;color:#8ce8b4}
.btn-next:hover{background:#234734}
.btn-danger{background:#3a1c1c;border-color:#6b2f2f;color:#ffb4b4}
.btn-danger:hover{background:#4a2323}
.sep{width:1px;height:22px;background:var(--line2);margin:0 3px}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 12px}
.seg button+button{border-left:1px solid var(--line2)}

/* ---------------- grid ---------------- */
main{padding:20px 0 70px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(392px,1fr));gap:16px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);transition:.18s;position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--undec)}
.card.keep::before{background:var(--keep)} .card.partial::before{background:var(--partial)}
.card.drop::before{background:var(--drop)} .card.drop{opacity:.44;filter:saturate(.45)}
.card.keep{border-color:#256b45;background:linear-gradient(180deg,var(--keepbg),var(--card) 60%)}
.card.partial{border-color:#8a6a1e;background:linear-gradient(180deg,var(--partialbg),var(--card) 60%)}
.card.drop{background:var(--dropbg);border-color:#5e2b2b}
.card.undec::before{background:var(--undec)}
.card.flash{animation:fl 1.1s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:var(--shadow)}}

.chead{display:flex;gap:12px;align-items:flex-start}
.thumb{width:74px;height:96px;flex:none;border-radius:9px;overflow:hidden;
  background:#0a0c10;border:1px solid var(--line);display:grid;place-items:center;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{font-size:9px;color:var(--tx3);text-align:center;padding:3px;line-height:1.3}
.cname{font-size:16px;font-weight:650;line-height:1.25;margin-bottom:3px}
.cmods{font-size:11.5px;color:var(--tx3);line-height:1.35;max-height:2.7em;overflow:hidden}
.cmod-tag{display:inline-block;background:#232a3a;border:1px solid var(--line2);
  border-radius:5px;padding:1px 6px;margin:2px 3px 0 0;font-size:10.5px;color:var(--tx2)}

/* fact rows */
.facts{margin:12px 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
.f{display:flex;gap:7px;font-size:12.5px;align-items:baseline;min-width:0}
.f .k{color:var(--tx3);flex:none;font-size:11px;min-width:64px;text-transform:uppercase;letter-spacing:.5px}
.f .v{color:var(--tx);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10.5px;padding:1px 7px;border-radius:5px;background:#232a3a;
  border:1px solid var(--line2);font-weight:600;white-space:nowrap;display:inline-block}
.tag.A{background:#123a2a;border-color:#2f8a55;color:#8ce8b4}
.tag.B{background:#1a2b45;border-color:#33639c;color:#a8c9ff}
.tag.C{background:#2e2a45;border-color:#5a4d8c;color:#c6b4ff}
.tag.D{background:#3d2a12;border-color:#8c6320;color:#ffcf8a}
.tag.E{background:#3a1a1a;border-color:#8c3030;color:#ffa8a8}
.cost-LOW{color:var(--keep)} .cost-MEDIUM{color:var(--partial)} .cost-HIGH{color:var(--drop)}

/* part chips */
.parts{margin:10px 0 2px;display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:2px 8px;border-radius:6px;background:#1a2030;
  border:1px solid var(--line2);color:var(--tx2)}
.chip.more{background:transparent;border-style:dashed}

/* decision buttons */
.dec{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:13px 0 8px}
.dbtn{padding:12px 6px;font-size:14px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.d-keep{background:#16241c;border-color:#2c5c40;color:#7fd6a5}
.d-keep:hover{background:#1d3325}
.d-keep.on{background:var(--keep);border-color:var(--keep);color:#08240f}
.d-partial{background:#2a2312;border-color:#6b5520;color:#e8c473}
.d-partial:hover{background:#372d17}
.d-partial.on{background:var(--partial);border-color:var(--partial);color:#2b1f05}
.d-drop{background:#2a1818;border-color:#6b3030;color:#f0a0a0}
.d-drop:hover{background:#371e1e}
.d-drop.on{background:var(--drop);border-color:var(--drop);color:#2b0808}
.d-undec{background:#1a1f2c;border-color:var(--line2);color:var(--tx2)}
.d-undec.on{background:var(--undec);border-color:var(--undec);color:#e8ecf5}
.dbtn.on{box-shadow:0 0 0 2px rgba(255,255,255,.13) inset}

/* priority + notes */
.prow{display:flex;align-items:center;gap:8px;margin:2px 0 9px;opacity:.75}
.prow .pl{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px}
.pseg{display:inline-flex;gap:3px}
.pseg button{padding:3px 9px;font-size:11px;border-radius:6px;font-weight:700}
.pseg button.on{background:#24304a;border-color:var(--acc);color:#cfe0ff}
textarea{width:100%;min-height:52px;resize:vertical;font-size:12.5px;line-height:1.45}

/* details */
details{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
summary{cursor:pointer;font-size:12px;color:var(--tx2);list-style:none;user-select:none;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--tx3)}
details[open] summary::before{content:"▾ "}
.dtable{margin-top:9px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.dtable .k{color:var(--tx3);white-space:nowrap}
.dtable .v{color:var(--tx2);word-break:break-word}

/* partial panel */
.panel{margin-top:11px;border:1px solid #6b5520;border-radius:11px;
  background:linear-gradient(180deg,#221b0d,#181410);padding:12px}
.panel h4{font-size:12px;letter-spacing:.7px;text-transform:uppercase;
  color:var(--partial);margin-bottom:3px}
.panel .hint{font-size:11px;color:var(--tx3);margin-bottom:9px}
.plist{display:flex;flex-direction:column;gap:5px;max-height:340px;overflow-y:auto}
.prow2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  background:#1a1a22;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.prow2.pkeep{border-color:#2c5c40;background:#152218}
.prow2.pdrop{border-color:#6b3030;background:#221414;opacity:.62}
.pmeta{min-width:0}
.pnm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psub{font-size:10.5px;color:var(--tx3);display:flex;gap:9px;flex-wrap:wrap;margin-top:2px}
.psub span{white-space:nowrap}
.pbtns{display:flex;gap:4px}
.pbtns button{padding:4px 9px;font-size:10.5px;border-radius:6px;font-weight:700}
.pk.on{background:var(--keep);border-color:var(--keep);color:#08240f}
.pd.on{background:var(--drop);border-color:var(--drop);color:#2b0808}
.pfoot{display:flex;gap:8px;margin-top:9px;align-items:center;font-size:11px;color:var(--tx3)}

/* completion */
.done{margin:0 0 18px;padding:14px 18px;border-radius:12px;border:1px solid #2f6b47;
  background:linear-gradient(180deg,#12281c,#141b18);display:none}
.done.show{display:block}
.done.partial{background:linear-gradient(180deg,#2a2210,#1a1710);border-color:#8a6a1e}
.done h3{font-size:15px;margin-bottom:3px}
.done p{font-size:12.5px;color:var(--tx2)}

/* modal + lightbox */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:none;
  place-items:center;padding:34px}
.mask.show{display:grid}
.mask img{max-width:94vw;max-height:88vh;border-radius:10px}
.mask .x{position:absolute;top:20px;right:24px;font-size:30px;background:none;border:0;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--tx3)}
footer{padding:20px 0 40px;color:var(--tx3);font-size:11.5px;text-align:center;
  border-top:1px solid var(--line)}
@media(max-width:900px){
  .toolbar{position:static} .grid{grid-template-columns:1fr} .facts{grid-template-columns:1fr}
  html{scroll-padding-top:20px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <h1>ZLJ Wardrobe Collection</h1>
      <span class="sub">P01 Wardrobe Curation · Outfit Review</span>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="trow">
      <span class="lab">Decision</span>
      <div class="seg" id="f-dec">
        <button data-v="ALL" class="on">ALL</button><button data-v="UNDECIDED">UNDECIDED</button>
        <button data-v="KEEP">KEEP</button><button data-v="PARTIAL">PARTIAL</button>
        <button data-v="DROP">DROP</button>
      </div>
      <span class="sep"></span>
      <span class="lab">Body</span><select id="f-body"></select>
      <span class="lab">Cost</span><select id="f-cost"></select>
      <span class="lab">UBE</span><select id="f-ube"></select>
      <span class="lab">Material</span><select id="f-mat"></select>
      <div class="spacer"></div>
      <button class="btn-next" id="next">▶ NEXT UNDECIDED</button>
    </div>
    <div class="trow">
      <input type="search" id="q" placeholder="搜索 Outfit / Mod / Part 名称…">
      <span class="lab">Sort</span>
      <select id="sort">
        <option value="orig">原 P01 顺序</option>
        <option value="name">名称</option>
        <option value="size">体积（大→小）</option>
        <option value="cost">Technical Cost</option>
        <option value="ube">UBE Class</option>
        <option value="dec">Decision</option>
      </select>
      <span class="sep"></span>
      <button id="exj">Export JSON</button>
      <button id="exc">Export CSV</button>
      <button id="exb">Export Backup</button>
      <button id="imp">Import Previous State</button>
      <input type="file" id="impf" accept=".json,application/json" hidden>
      <span class="sep"></span>
      <button id="undo">Undo Last Decision</button>
      <button id="rc">Reset Current Outfit</button>
      <button class="btn-danger" id="ra">RESET ALL</button>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="done" id="done"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  P01 Wardrobe Review · 单文件离线工具 · 数据来自已冻结的 P00 / P01 结果 ·
  本页只做人工筛选，不修改任何 Skyrim / MO2 资产
</footer>

<div class="mask" id="mask"><button class="x" id="mx">×</button><img id="mimg" alt=""></div>

<script>
const DATA = /*__DATA__*/null;

/* ------------------------------------------------------------------ state */
const S = {dec:{},pri:{},note:{},parts:{}};
const LS = "p01_wardrobe_review_v1";
function blankParts(o){ const m={}; (o.parts||[]).forEach(p=>{m[p.id]="UNDECIDED";}); return m; }
function initParts(){
  DATA.outfits.forEach(o=>{ S.dec[o.id]="UNDECIDED"; S.pri[o.id]="UNSET"; S.note[o.id]=""; S.parts[o.id]=blankParts(o); });
}
const omap = {}; DATA.outfits.forEach(o=>omap[o.id]=o);

/* ------------------------------------------------------------------ utils */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dec  = id=>S.dec[id]||"UNDECIDED";
const pri  = id=>S.pri[id]||"UNSET";
const COST_R={"LOW":0,"MEDIUM":1,"HIGH":2};
function mb(v){const n=Number(String(v==null?"":v).replace(/[^0-9.]/g,""));return isNaN(n)?0:n;}
function prettySize(v){const n=Number(String(v==null?"":v).replace(/[^0-9.]/g,""));if(!n)return "?";if(n>=1073741824)return (n/1073741824).toFixed(2)+" GiB";if(n>=1048576)return (n/1048576).toFixed(1)+" MB";if(n>=1024)return (n/1024).toFixed(0)+" KB";return n+" B";}
function matBucket(o){
  const m=(o.material_candidates||"").toLowerCase();
  for(const k of ["latex","silk","satin","nylon","leather"]) if(m.includes(k)) return k[0].toUpperCase()+k.slice(1);
  if(m.trim() && !/^(unknown|none)$/.test(m.trim())) return "Other";
  return "UNKNOWN";
}
function shortMat(s){ return s.length>44 ? s.slice(0,44)+"…" : s; }
function partsOf(id){ return (omap[id]&&omap[id].parts)||[]; }

/* ------------------------------------------------------------------ persist */
let saveT=null;
function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} },250); }
function restore(){ try{ const r=localStorage.getItem(LS); if(r) loadState(JSON.parse(r),true); }catch(e){} }
function loadState(st,silent){
  let ok=0,bad=0,parts=0;
  (st.decisions||st.outfits||[]).forEach(r=>{
    const id=r.outfit_id||r.OUTFIT_ID; if(!omap[id]){bad++;return;}
    ok++;
    if(r.decision) S.dec[id]=r.decision;
    if(r.priority)  S.pri[id]=r.priority;
    if(r.note!=null) S.note[id]=r.note;
    (r.parts||[]).forEach(p=>{
      const pid=p.visual_part_id||p.VISUAL_PART_ID;
      if(S.parts[id]&&Object.prototype.hasOwnProperty.call(S.parts[id],pid)){S.parts[id][pid]=p.part_decision||"UNDECIDED";parts++;}
    });
  });
  if(!silent) alert(`已恢复 ${ok} 套决策`+(parts?`，${parts} 个零件决策`:"")+(bad?`\n忽略 ${bad} 条无法匹配的 outfit_id`:""));
  render(); persist();
}

/* ------------------------------------------------------------------ undo */
const hist=[];
function pushUndo(){ hist.push(JSON.parse(JSON.stringify(S))); if(hist.length>60)hist.shift(); }
function undo(){
  if(!hist.length){ alert("没有可撤销的操作。"); return; }
  const p=hist.pop(); ["dec","pri","note","parts"].forEach(k=>S[k]=p[k]); render(); persist();
}

/* ------------------------------------------------------------------ render */
function counts(){
  const c={KEEP:0,PARTIAL:0,DROP:0,UNDECIDED:0};
  DATA.outfits.forEach(o=>c[dec(o.id)]++);
  return c;
}
function renderStats(){
  const c=counts(),done=c.KEEP+c.PARTIAL+c.DROP,N=DATA.outfits.length;
  $("#stats").innerHTML=
    `<span class="pill"><span class="dot t"></span>Total <b>${N}</b></span>`+
    `<span class="pill"><span class="dot k"></span>KEEP <b>${c.KEEP}</b></span>`+
    `<span class="pill"><span class="dot p"></span>PARTIAL <b>${c.PARTIAL}</b></span>`+
    `<span class="pill"><span class="dot d"></span>DROP <b>${c.DROP}</b></span>`+
    `<span class="pill"><span class="dot u"></span>UNDECIDED <b>${c.UNDECIDED}</b></span>`+
    `<span class="pill" style="min-width:270px">${"█".repeat(Math.round(done/N*22))}${"░".repeat(22-Math.round(done/N*22))} <b>${done}</b> / ${N} reviewed</span>`;
  const c2=counts();
  if(c2.UNDECIDED===0){
    let rem=0;
    DATA.outfits.forEach(o=>{ if(dec(o.id)==="PARTIAL") Object.values(S.parts[o.id]||{}).forEach(v=>{ if(v==="UNDECIDED") rem++; }); });
    const d=$("#done");
    if(rem>0){ d.className="done show partial";
      d.innerHTML=`<h3>Outfit selection complete</h3><p>56 套 Outfit 均已选择 KEEP / PARTIAL / DROP，但仍有 <b>${rem}</b> 个 PARTIAL 零件尚未处理（KEEP PART / DROP PART）。</p>`;
    } else {
      d.className="done show";
      d.innerHTML=`<h3>P01 Outfit Review Complete</h3><p>56 套 Outfit 全部决定完毕，PARTIAL 零件也已处理完。请用 <b>Export CSV</b> 与 <b>Export JSON</b> 导出结果并交回项目。</p>`;
    }
  } else { $("#done").className="done"; }
}

function currentList(){
  const fd=$("#f-dec .on").dataset.v;
  const fb=$("#f-body").value, fc=$("#f-cost").value, fu=$("#f-ube").value, fm=$("#f-mat").value;
  const q=$("#q").value.trim().toLowerCase();
  let L=DATA.outfits.filter(o=>{
    if(fd!=="ALL" && dec(o.id)!==fd) return false;
    if(fb && o.body_type!==fb) return false;
    if(fc && !String(o.technical_cost||"").startsWith(fc)) return false;
    if(fu && !partsOf(o.id).some(p=>p.ube===fu)) return false;
    if(fm && matBucket(o)!==fm) return false;
    if(q){
      const hay=[o.display_name,o.source_mods].concat(partsOf(o.id).map(p=>p.name)).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const s=$("#sort").value;
  const costRank=x=>{const m=/^(LOW|MEDIUM|HIGH)/.exec(String(x.technical_cost||""));return m?COST_R[m[1]]:9;};
  if(s==="name") L.sort((a,b)=>a.display_name.localeCompare(b.display_name,"zh"));
  else if(s==="size") L.sort((a,b)=>mb(b.current_size_bytes)-mb(a.current_size_bytes));
  else if(s==="cost") L.sort((a,b)=>costRank(a)-costRank(b)||mb(b.current_size_bytes)-mb(a.current_size_bytes));
  else if(s==="ube"){const best=o=>{const u=partsOf(o.id).map(p=>p.ube);return u.length?u.sort()[0]:"~";};L.sort((a,b)=>best(a).localeCompare(best(b))||mb(b.current_size_bytes)-mb(a.current_size_bytes));}
  else if(s==="dec"){const r={DROP:0,PARTIAL:1,UNDECIDED:2,KEEP:3};L.sort((a,b)=>r[dec(a.id)]-r[dec(b.id)]||mb(b.current_size_bytes)-mb(a.current_size_bytes));}
  return L;
}

function cardHTML(o){
  const d=dec(o.id), ps=partsOf(o.id);
  const cats=[];
  ps.forEach(p=>{ if(p.cat && !cats.includes(p.cat)) cats.push(p.cat); });
  const bestUbe = ps.length ? ps.map(p=>p.ube).sort()[0] : "-";
  const nDrop=ps.filter(p=>S.parts[o.id][p.id]==="DROP PART").length;
  const nKeep=ps.filter(p=>S.parts[o.id][p.id]==="KEEP PART").length;

  const thumb = o.preview
    ? `<div class="thumb" data-img="${o.id}"><img src="${o.preview}" alt=""></div>`
    : `<div class="thumb"><span class="ph">No Preview<br>Available</span></div>`;

  let panel="";
  if(d==="PARTIAL"){
    const items=ps.map(p=>{
      const v=S.parts[o.id][p.id]||"UNDECIDED";
      const cls=v==="KEEP PART"?"pkeep":v==="DROP PART"?"pdrop":"";
      return `<div class="prow2 ${cls}">
        <div class="pmeta">
          <div class="pnm" title="${esc(p.name)}">${esc(p.name)}</div>
          <div class="psub">
            <span>${esc(p.cat||"—")}</span>
            <span>slot: ${esc(p.slot||"—")}</span>
            <span>body: ${esc(p.body||"—")}</span>
            <span>${esc(p.phys||"—")}</span>
            <span class="tag ${p.ube}">UBE ${p.ube}</span>
          </div>
        </div>
        <div class="pbtns">
          <button class="pk ${v==="KEEP PART"?"on":""}" data-pk="${p.id}" data-o="${o.id}">KEEP</button>
          <button class="pd ${v==="DROP PART"?"on":""}" data-pd="${p.id}" data-o="${o.id}">DROP</button>
          <button class="pu" data-pu="${p.id}" data-o="${o.id}" title="重置">↺</button>
        </div>
      </div>`;
    }).join("");
    panel=`<div class="panel">
      <h4>Visual Parts · 本套专属</h4>
      <div class="hint">默认全部 UNDECIDED — 只勾选你要留或要丢的零件，不必一次选完。</div>
      <div class="plist">${items||'<div class="hint">该 outfit 没有视觉零件记录。</div>'}</div>
      <div class="pfoot"><span>KEEP ${nKeep} · DROP ${nDrop} · 未定 ${ps.length-nKeep-nDrop}</span>
      <div class="spacer"></div></div>
      <button data-pall="${o.id}">全部 KEEP PART</button>
      <button data-pnone="${o.id}">全部重置</button></div>
    </div>`;
  }

  return `<article class="card ${d.toLowerCase()}" id="oc-${esc(o.id)}" data-id="${esc(o.id)}">
    <div class="chead">
      ${thumb}
      <div style="min-width:0;flex:1">
        <div class="cname">${esc(o.display_name)}</div>
        <div class="cmods">${(o.source_mods||"").split(";").filter(Boolean)
          .map(m=>`<span class="cmod-tag">${esc(m.trim().slice(0,44))}</span>`).join("")}</div>
      </div>
    </div>

    <div class="facts">
      <div class="f"><span class="k">Body</span><span class="v">${esc(o.body_type||"UNKNOWN")}</span></div>
      <div class="f"><span class="k">Size</span><span class="v">${prettySize(o.current_size_bytes)}</span></div>
      <div class="f"><span class="k">Parts</span><span class="v" title="${esc(cats.join(" / "))}">${esc(cats.slice(0,4).join(" / ")||"—")}${cats.length>4?` +${cats.length-4}`:""}</span></div>
      <div class="f"><span class="k">Material</span><span class="v" title="${esc(o.material_candidates||"")}">${esc(shortMat(o.material_candidates||"UNKNOWN"))}</span></div>
      <div class="f"><span class="k">Physics</span><span class="v">${esc(o.physics||"UNKNOWN")}</span></div>
      <div class="f"><span class="k">BodySlide</span><span class="v">${esc(o.n_effective_bodyslide_projects||"0")} projects</span></div>
      <div class="f"><span class="k">Cost</span><span class="v cost-${String(o.technical_cost||"").match(/^(LOW|MEDIUM|HIGH)/)?.[1]||"X"}">${esc(String(o.technical_cost||"—").split("（")[0])}</span></div>
      <div class="f"><span class="k">UBE</span><span class="v"><span class="tag ${bestUbe}">${bestUbe}</span></span></div>
      <div class="f"><span class="k">Deps</span><span class="v">${esc(o.cross_mod_dependency_count||"0")}</span></div>
      <div class="f"><span class="k">Unresolved</span><span class="v">${esc(o.unresolved_dependency_count||"0")}</span></div>
    </div>

    <div class="parts">${ps.slice(0,7).map(p=>`<span class="chip" title="${esc(p.cat)} · UBE ${p.ube}">${esc(p.name.slice(0,26))}</span>`).join("")}
      ${ps.length>7?`<span class="chip more">+${ps.length-7}</span>`:""}</div>

    <div class="dec">
      <button class="dbtn d-keep   ${d==="KEEP"?"on":""}"    data-dec="KEEP"    data-o="${esc(o.id)}">KEEP</button>
      <button class="dbtn d-partial ${d==="PARTIAL"?"on":""}" data-dec="PARTIAL" data-o="${esc(o.id)}">PARTIAL</button>
      <button class="dbtn d-drop   ${d==="DROP"?"on":""}"    data-dec="DROP"    data-o="${esc(o.id)}">DROP</button>
    </div>
    <button class="dbtn d-undec ${d==="UNDECIDED"?"on":""}" style="width:100%;padding:7px;font-size:12px" data-dec="UNDECIDED" data-o="${esc(o.id)}">UNDECIDED</button>

    ${panel}

    <div class="prow">
      <span class="pl">Priority</span>
      <div class="pseg">${["UNSET","S","A","B","C"].map(p=>
        `<button class="${pri(o.id)===p?"on":""}" data-pri="${p}" data-o="${esc(o.id)}">${p}</button>`).join("")}</div>
    </div>
    <textarea data-note="${esc(o.id)}" placeholder="Notes — 例如：只要靴子和面罩 / XP 核心必留 / 以后转 UBE">${esc(S.note[o.id]||"")}</textarea>

    <details>
      <summary>Technical Details</summary>
      <div class="dtable">
        <span class="k">Source mods</span><span class="v">${esc(o.source_mods||"—")}</span>
        <span class="k">Plugins</span><span class="v">${esc(o.plugins||"—")}</span>
        <span class="k">ARMO / ARMA</span><span class="v">${esc(o.n_ARMO||"?")} / ${esc(o.n_ARMA||"?")}</span>
        <span class="k">Wearable NIF</span><span class="v">${esc(o.n_wearable_NIF||"?")}</span>
        <span class="k">Textures</span><span class="v">${esc(o.n_texture||"?")}</span>
        <span class="k">BodySlide</span><span class="v">${esc(o.n_effective_bodyslide_projects||"0")} effective (shadowed: ${esc(o.n_shadowed_projects||"0")})</span>
        <span class="k">Cross-mod deps</span><span class="v">${esc(o.cross_mod_dependency_count||"0")}</span>
        <span class="k">Unresolved</span><span class="v">${esc(o.unresolved_dependency_count||"0")}</span>
        <span class="k">Merge risk</span><span class="v">${esc(o.merge_risk||"—")}</span>
        <span class="k">Size (current)</span><span class="v">${esc(o.current_size_bytes||"?")} B</span>
        <span class="k">Size (effective)</span><span class="v">${esc(o.effective_asset_size_bytes||"?")} B</span>
        <span class="k">Duplicate bytes</span><span class="v">${esc(o.duplicate_asset_bytes||"0")}</span>
        <span class="k">PBR state</span><span class="v">${esc(o.pbr_state||"—")}</span>
        <span class="k">Role</span><span class="v">${esc(o.role||"—")}</span>
        <span class="k">Cost reason</span><span class="v">${esc(o.cost_reason||"—")}</span>
      </div>
    </details>
  </article>`;
}

let lastFocused="";
function render(){
  const L=currentList();
  const g=$("#grid");
  g.innerHTML = L.length ? L.map(cardHTML).join("")
    : '<div class="empty">没有符合当前筛选条件的 Outfit。</div>';
  renderStats();
}

/* ------------------------------------------------------------------ events */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-img]"); if(!t) return;

  // a thumbnail carries data-img, so this single branch is the whole
  // lightbox path; the element itself is the click target, not a child
  if(t.dataset.img){ $("#mimg").src=omap[t.dataset.img].preview; $("#mask").classList.add("show"); return; }

  if(t.dataset.dec){
    pushUndo(); const id=t.dataset.o;
    S.dec[id]=t.dataset.dec; lastFocused=id;
    if(t.dataset.dec!=="PARTIAL" && S.parts[id]){/* keep part decisions, they may return */ }
    persist(); render(); flash(id);
    return;
  }
  if(t.dataset.pk){ pushUndo(); S.parts[t.dataset.o][t.dataset.pk]="KEEP PART"; persist(); render(); return; }
  if(t.dataset.pd){ pushUndo(); S.parts[t.dataset.o][t.dataset.pd]="DROP PART"; persist(); render(); return; }
  if(t.dataset.pu){ pushUndo(); S.parts[t.dataset.o][t.dataset.pu]="UNDECIDED"; persist(); render(); return; }
  if(t.dataset.pall){ pushUndo(); Object.keys(S.parts[t.dataset.pall]||{}).forEach(k=>S.parts[t.dataset.pall][k]="KEEP PART"); persist(); render(); return; }
  // the reset button carries data-pnone; reading dataset.pall here was a
  // mismatch that made this button throw and do nothing
  if(t.dataset.pnone){ pushUndo(); Object.keys(S.parts[t.dataset.pnone]||{}).forEach(k=>S.parts[t.dataset.pnone][k]="UNDECIDED"); persist(); render(); return; }
  if(t.dataset.pri){ pushUndo(); S.pri[t.dataset.o]=t.dataset.pri; persist(); render(); return; }
});

document.addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.note){ S.note[e.target.dataset.note]=e.target.value; persist(); }
  if(e.target.id==="q"){ render(); }
});

function flash(id){
  const el=document.getElementById("oc-"+id);
  if(el){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}

/* filters */
$("#f-dec").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  [...$("#f-dec").children].forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); render();
});
function opts(sel,vals){
  sel.innerHTML=`<option value="">All</option>`+vals.map(v=>`<option value="${v}">${v}</option>`).join("");
}
opts($("#f-body"),["CBBE_3BA","CBBE","BHUNP","MIXED","UNKNOWN"]);
opts($("#f-cost"),["LOW","MEDIUM","HIGH"]);
opts($("#f-ube"),["A","B","C","D","E"]);
opts($("#f-mat"),["Latex","Silk","Satin","Nylon","Leather","Other","UNKNOWN"]);
["#f-body","#f-cost","#f-ube","#f-mat","#sort"].forEach(s=>$(s).addEventListener("change",render));

/* next undecided */
$("#next").addEventListener("click",()=>{
  const L=currentList(); if(!L.length){ alert("当前筛选下没有 Outfit。"); return; }
  let t=L.find(o=>dec(o.id)==="UNDECIDED");
  if(!t){ const doneAll=counts().UNDECIDED===0;
    alert(doneAll?"56 套 Outfit 已全部决定。\n可切换筛选或用 Export 导出结果。":"当前筛选范围内已没有未决定的 Outfit。\n试试切换到 ALL 或 UNDECIDED。");
    return; }
  const el=document.getElementById("oc-"+t.id);
  if(el){ el.scrollIntoView({behavior:"smooth",block:"center"});
    el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1200); }
});

/* undo / reset */
$("#undo").addEventListener("click",undo);
$("#rc").addEventListener("click",()=>{
  if(!lastFocused){ alert("请先点击一套 Outfit 的决策按钮，再执行 Reset。"); return; }
  if(!confirm(`Reset ${omap[lastFocused].display_name} 的决策、Priority、Notes 和零件勾选？`)) return;
  pushUndo(); S.dec[lastFocused]="UNDECIDED"; S.pri[lastFocused]="UNSET"; S.note[lastFocused]="";
  S.parts[lastFocused]=blankParts(omap[lastFocused]); persist(); render();
});
$("#ra").addEventListener("click",()=>{
  if(!confirm("确定清空全部 56 套决策？\n\n所有 KEEP / PARTIAL / DROP、Priority、Notes 和零件勾选都会归零。\n此操作可用 Undo Last Decision 撤销一次。")) return;
  if(!confirm("再次确认：真的要清空全部 56 套决策吗？")) return;
  initParts(); persist(); render();
});

/* ------------------------------------------------------------------ export */
function dl(name,text,mime){
  const b=new Blob(["﻿"+text],{type:(mime||"text/plain")+";charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}
function q(s){ return '"'+String(s==null?"":s).replace(/"/g,'""')+'"'; }
function now(){ return new Date().toISOString(); }

$("#exj").addEventListener("click",()=>{
  const out=DATA.outfits.filter(o=>dec(o.id)!=="UNDECIDED"||S.note[o.id]||pri(o.id)!=="UNSET")
    .map(o=>({outfit_id:o.id,display_name:o.display_name,decision:dec(o.id),priority:pri(o.id),note:S.note[o.id]||""}));
  dl("P01_USER_DECISIONS.json",JSON.stringify({generated:now(),source:"P01 Wardrobe Review",decisions:out},null,2),"application/json");
});
$("#exc").addEventListener("click",()=>{
  let s="OUTFIT_ID,OUTFIT_NAME,USER_DECISION,USER_PRIORITY,USER_NOTE\n";
  DATA.outfits.forEach(o=>{ s+=`${q(o.id)},${q(o.display_name)},${q(dec(o.id))},${q(pri(o.id))},${q(S.note[o.id]||"")}\n`; });
  dl("P01_USER_DECISIONS.csv",s,"text/csv");

  let p="OUTFIT_ID,VISUAL_PART_ID,PART_NAME,PART_CATEGORY,USER_DECISION,USER_NOTE\n";
  let n=0;
  DATA.outfits.forEach(o=>{
    partsOf(o.id).forEach(pt=>{
      const v=(S.parts[o.id]||{})[pt.id]||"UNDECIDED";
      p+=`${q(o.id)},${q(pt.id)},${q(pt.name)},${q(pt.cat)},${q(v==="KEEP PART"?"KEEP PART":v==="DROP PART"?"DROP PART":"UNDECIDED")},\n`; n++;
    });
  });
  setTimeout(()=>dl("P01_USER_PART_DECISIONS.csv",p,"text/csv"),350);
  alert(`已导出：\n· P01_USER_DECISIONS.csv（56 行）\n· P01_USER_PART_DECISIONS.csv（${n} 行）`);
});
$("#exb").addEventListener("click",()=>{
  const st={generated:now(),app:"ZLJ Wardrobe Collection — P01 Wardrobe Review",version:1,
    outfits:DATA.outfits.map(o=>({
      outfit_id:o.id, decision:dec(o.id), priority:pri(o.id), note:S.note[o.id]||"",
      parts:partsOf(o.id).map(p=>({visual_part_id:p.id,part_name:p.name,part_decision:(S.parts[o.id]||{})[p.id]||"UNDECIDED"}))
    }))};
  dl("P01_WARDROBE_REVIEW_STATE.json",JSON.stringify(st,null,2),"application/json");
});
$("#imp").addEventListener("click",()=>$("#impf").click());
$("#impf").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ loadState(JSON.parse(r.result)); }catch(err){ alert("无法解析该文件：\n"+err.message); } };
  r.readAsText(f,"utf-8"); e.target.value="";
});

/* lightbox */
$("#mask").addEventListener("click",e=>{ if(e.target.id!=="mimg") $("#mask").classList.remove("show"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#mask").classList.remove("show"); });

/* ------------------------------------------------------------------ boot */
initParts();
restore();
render();
</script>
</body>
</html>
